version = "0.1.0"
edition = "2024"

[dependencies]
keys-lib = "0.1.0"
reqwest = { version = "0.12.23", features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.142"
url = "2.5.4"
